name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Tipos, testes, build e auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Scripts de implantação (sintaxe e testes)
        run: |
          for f in deploy/*.sh deploy/backup/*.sh; do bash -n "$f"; done
          bash deploy/testes/lib.test.sh
      - name: Dependências sem vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Stack Docker completa + teste de fumaça
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Gerar .env de teste
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null
          age-keygen -o /tmp/chave-teste.txt 2>/dev/null
          cat > .env <<EOF
          CRM_DOMAIN=localhost
          CRM_HTTP_PORT=8180
          POSTGRES_PASSWORD=$(openssl rand -hex 32)
          JWT_ACCESS_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          APP_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')
          BACKUP_AGE_RECIPIENT=$(age-keygen -y /tmp/chave-teste.txt)
          BACKUP_DIR=./backups
          SEED_ADMIN_EMAIL=admin@exemplo.com.br
          CRM_VERSION=ci
          EOF
          mkdir -p backups && sudo chown 70:70 backups
      - name: Build das imagens
        run: docker compose build
      - name: Banco + migrations + seed
        run: |
          docker compose up -d --wait db
          docker compose run --rm --no-deps api prisma migrate deploy
          docker compose run --rm --no-deps api prisma db seed
      - name: Subir a aplicação
        run: docker compose up -d --wait
      - name: Teste de fumaça (cabeçalhos, CSRF, permissões)
        # COOKIE_SECURE=true em produção: no CI o acesso é por http, então os testes de "Secure"/HSTS são pulados.
        run: node scripts/teste-fumaca.mjs http://127.0.0.1:8180
      - name: Backup criptografado
        run: |
          docker compose run --rm --no-deps backup /usr/local/bin/backup.sh
          sudo ls -l backups/
      # Os arquivos de backup têm permissão 600 (dono: usuário do Postgres). Na VPS os scripts rodam com sudo; aqui também.
      - name: Teste de restauração (banco separado)
        run: |
          ARQ=$(sudo sh -c 'ls backups/crm-db-*.dump.age | head -1')
          sudo bash deploy/restaurar.sh --teste "$ARQ" /tmp/chave-teste.txt
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail=200
