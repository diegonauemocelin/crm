name: Publicar versão

# Ao enviar uma tag vX.Y.Z:
#  1. confere a versão;
#  2. constrói as imagens Docker e publica no GitHub Container Registry (a VPS só baixa, sem compilar);
#  3. publica a Release com as notas do releases.json (é o que o rodapé consulta para "nova versão disponível").
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  imagens:
    name: Imagens Docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - nome: api
            contexto: .
            dockerfile: apps/api/Dockerfile
          - nome: web
            contexto: .
            dockerfile: apps/web/Dockerfile
          - nome: backup
            contexto: deploy/backup
            dockerfile: deploy/backup/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Conferir versão
        run: node scripts/check-release.mjs "${GITHUB_REF_NAME}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Metadados
        id: meta
        run: |
          echo "versao=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "data=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "imagem=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.nome }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.imagem }}:${{ steps.meta.outputs.versao }}
            ${{ steps.meta.outputs.imagem }}:latest
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.data }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.versao }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}

  release:
    name: Release no GitHub
    runs-on: ubuntu-latest
    needs: imagens
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Gerar notas da versão
        run: |
          node -e '
            const r = require("./releases.json").releases[0];
            const nomes = { novo: "Novo", melhoria: "Melhoria", correcao: "Correção", seguranca: "Segurança", infra: "Infraestrutura" };
            const areas = [...new Set(r.changes.map(c => c.area || "Geral"))];
            let md = `## ${r.title}\n\nPublicada em ${r.date}.\n`;
            for (const a of areas) {
              md += `\n### ${a}\n`;
              for (const c of r.changes.filter(c => (c.area || "Geral") === a)) md += `- **${nomes[c.type] || c.type}:** ${c.text}\n`;
            }
            require("fs").writeFileSync("notas.md", md);
          '
      - name: Criar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notas.md --verify-tag
